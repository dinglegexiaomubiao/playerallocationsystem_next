# 安全响应头（单一来源）。
#
# 为什么单独成一个片段：Nginx 的 add_header 是「子级有则父级全丢」的继承规则——
# 只要某个 location 里写了一条 add_header（比如 Cache-Control），server 级
# 这一堆头就全部静默消失。所以凡是自己加 add_header 的 location，都必须
# include 本文件，否则页面会悄悄丢掉 CSP / HSTS。
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
