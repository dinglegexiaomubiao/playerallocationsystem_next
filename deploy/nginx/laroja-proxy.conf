    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/laroja-sec-headers.conf;
        # 不先隐藏上游的 Cache-Control，这里就会出现两个同名头
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/avatar/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/laroja-sec-headers.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /api/hero-icon/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/laroja-sec-headers.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        include /etc/nginx/snippets/laroja-sec-headers.conf;
        # HTML / API 一律 no-cache：每次都回服务器确认（有 ETag，未变就 304，不费流量）。
        #
        # 2026-10-21 事故：这里原先什么缓存头都没有，浏览器因此走「启发式缓存」，
        # 手机端会长时间抱着旧 HTML 不放。而每次部署都会重建 .next，
        # 旧 HTML 里引用的 _next/static/<旧buildId>/*.js 已不存在 → 404 →
        # React 不 hydrate → 页面 HTML 正常显示、但一条数据都取不到。
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
