# 站点 Nginx 配置（最终版 · Ubuntu 22.04 + certbot + HTTPS）
#
# 这是 2026-10-20 实际部署到服务器的配置，可供重建时参考。
#
# 服务器上的实际结构：
#   /etc/nginx/snippets/laroja-proxy.conf        公共代理配置（两个 server 块共用）
#   /etc/nginx/sites-available/laroja            ← 本文件的两个 server 块
#   /etc/nginx/sites-enabled/laroja              → 软链到上面
#
# 应用：Next.js 跑在 127.0.0.1:3000（PM2 管理）
# 证书：Let's Encrypt，certbot 自动续期
#
# 注意 Nginx 1.18 的语法差异：必须写 `listen 443 ssl http2;`，
# 不能用 1.25+ 的 `http2 on;`，否则 nginx -t 报 unknown directive。


