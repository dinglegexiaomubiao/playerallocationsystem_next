# ============================================================
# 二、/etc/nginx/sites-available/laroja
# ============================================================

# ---- HTTP：全部 301 跳转到 HTTPS ----
# 保留 acme-challenge 路径，否则证书续期验证会失败
server {
    listen 80;
    listen [::]:80;
    server_name dota.playerallocationsystem.online 47.115.130.170;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dota.playerallocationsystem.online;

    ssl_certificate     /etc/letsencrypt/live/dota.playerallocationsystem.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dota.playerallocationsystem.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/laroja-proxy.conf;
}


# ============================================================
# 部署时的操作顺序（踩过坑，按这个来）
# ============================================================
#
# 1. 先只配 80 + 反代，确认站点能访问
# 2. certbot certonly --nginx -d 域名 --email 你的邮箱 --agree-tos --non-interactive
#    （HTTP-01 验证走 80，不需要 443）
# 3. 确认阿里云安全组已放行 443，并从外网探测：
#      bash -c 'cat < /dev/null > /dev/tcp/你的IP/443'
# 4. 确认 443 通了，再加 80 → 301 跳转
#
# ⚠ 第 3 步不能跳过。80 已跳转但 443 没放行 = 站点完全打不开。
